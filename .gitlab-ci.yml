collect:
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # Install awscli (v1 from PyPI) and the billing tool from source
    - pip install --quiet awscli .

    # Restore DB from S3 — skip gracefully on first run (no DB yet)
    - aws s3 cp s3://$S3_BUCKET/sensor_billing.db ./sensor_billing.db || echo "No existing DB in S3, starting fresh."

    # Collect current hour — write output to file to preserve exit code
    - falcon-billing collect --days 0 --prune > /tmp/collect_output.txt 2>&1; COLLECT_EXIT=$?
    - OUTPUT=$(cat /tmp/collect_output.txt)
    - echo "$OUTPUT"

    # Fail explicitly if the collect command itself exited non-zero
    - |
      if [ "$COLLECT_EXIT" -ne 0 ]; then
        echo "ERROR: Collection command failed with exit code $COLLECT_EXIT. Check logs above."
        exit 1
      fi

    # Guard: fail if stored sensor count is 0 (covers NGSIEM and Hosts API fallback paths)
    - |
      if echo "$OUTPUT" | grep -q "Stored hourly count: 0"; then
        echo "ERROR: 0 unique sensors stored — collection returned empty. Check API credentials and ngsiem:read scope."
        exit 1
      fi

    # Guard: fail if sensor count line is missing entirely (unexpected failure)
    - |
      if ! echo "$OUTPUT" | grep -q "unique sensors"; then
        echo "ERROR: No sensor count in output — collection may have failed silently. Check logs above."
        exit 1
      fi

    # Export CSVs before pushing DB (so artifacts are generated even if S3 push fails)
    - falcon-billing query --output billing_by_cid.csv
    - falcon-billing tag-report --output billing_by_tag.csv

    # Persist updated DB back to S3
    - aws s3 cp ./sensor_billing.db s3://$S3_BUCKET/sensor_billing.db

  artifacts:
    name: "falcon-billing-$CI_PIPELINE_IID"
    paths:
      - billing_by_cid.csv
      - billing_by_tag.csv
    expire_in: 90 days
    when: on_success
